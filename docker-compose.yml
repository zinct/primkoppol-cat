services:
  db:
    image: mariadb:10.3
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-file-per-table=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
    volumes:
      - dbdata:/var/lib/mysql
      # taruh dump Moodle (.sql) di ./initdb untuk auto-import saat pertama jalan
      - ./initdb:/docker-entrypoint-initdb.d
  moodle:
    build: .
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WWWROOT: http://localhost:8080
    volumes:
      # moodledata yang sudah ada (berisi filedir, dll)
      - "../catdata 2:/var/www/moodledata"
volumes:
  dbdata:
