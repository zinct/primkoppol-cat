services:
  moodle:
    build: .
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # moodledata yang sudah ada (berisi filedir, dll)
      - "${MOODLEDATA_PATH:-../catdata 2}:/var/www/moodledata"
    networks:
      - internal_network
      - database_network
    restart: unless-stopped

networks:
  database_network:
    external: true
    name: database_network
  internal_network:
    driver: bridge
